<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d4df6">
  <title>الصفحة غير موجودة | عالم الصغار الذكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    /* يختار المسار الصحيح للملفات مهما كان عمق الرابط (صفحة 404 تُعرض من أي مسار) */
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var repoIndex = parts.indexOf("smart-kids-world");
      var base = repoIndex >= 0 ? "/" + parts.slice(0, repoIndex + 1).join("/") + "/" : "/";
      var depth = parts.length;
      var tries = 0;

      function apply(path) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = path + "styles.css?v=32";
        link.onerror = function () {
          if (tries > depth) return;
          tries++;
          apply(new Array(tries + 1).join("../"));
        };
        link.onload = function () {
          var home = document.getElementById("homeLink");
          if (home) home.href = path + "index.html";
        };
        document.head.appendChild(link);
      }

      /* على GitHub Pages نعرف جذر المستودع مباشرة؛ وإلا نجرّب الارتفاع درجة درجة */
      apply(repoIndex >= 0 ? base : "");
    })();
  </script>
  <noscript><link rel="stylesheet" href="styles.css?v=32"></noscript>
</head>
<body>
  <main class="notfound-page">
    <div class="notfound-wrap">
      <span class="brand-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 14.5l.6 1.6 1.6.6-1.6.6L19 19l-.6-1.6-1.6-.6 1.6-.6z"/></svg>
        <span>عالم الصغار الذكي</span>
      </span>

      <p class="notfound-code" aria-hidden="true">404</p>

      <h1>هذه الصفحة غير موجودة</h1>
      <p class="notfound-text">ربما تغيّر رابطها أو حُذفت. لا تقلق، يمكنك العودة ومواصلة التعلّم من حيث توقفت.</p>

      <a class="btn-primary btn-lg" id="homeLink" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        العودة إلى الصفحة الرئيسية
      </a>
    </div>
  </main>
</body>
</html>
